version: "2"
linters:
  default: none
  enable:
    - godot
    - govet
    - lll
    - staticcheck
  settings:
    godot:
      scope: toplevel
      period: true
    lll:
      line-length: 100
      tab-width: 4
    staticcheck:
      checks:
        - all
        - -ST1003
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - lll
        source: "\t?// (see )?https://"
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: false
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
